name: Deploy Science Kit Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'TODO.md'

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      java: ${{ steps.filter.outputs.java }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            rust:
              - 'rust-engine/**'

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        if: ${{ needs.changes.outputs.java == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Rust
        if: ${{ needs.changes.outputs.rust == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Make Gradle executable
        if: ${{ needs.changes.outputs.java == 'true' }}
        run: chmod +x ./gradlew

      - name: Build Java JAR
        if: ${{ needs.changes.outputs.java == 'true' }}
        run: ./gradlew clean build -x test

      - name: Build Rust Microservice
        if: ${{ needs.changes.outputs.rust == 'true' }}
        run: |
          cd rust-engine
          cargo build --release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload Java JAR
        if: ${{ needs.changes.outputs.java == 'true' }}
        run: |
          scp build/libs/sciencekitbot.jar \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/sciencekit/sciencekitbot.jar"

      - name: Upload Rust Binary
        if: ${{ needs.changes.outputs.rust == 'true' }}
        run: |
          chmod +x rust-engine/target/release/science_kit_rust
          scp rust-engine/target/release/science_kit_rust \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/sciencekit/science_kit_rust"

      - name: Restart Services Conditionally
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "if [ '${{ needs.changes.outputs.java }}' = 'true' ]; then sudo systemctl restart sciencekit; fi && \
             if [ '${{ needs.changes.outputs.rust }}' = 'true' ]; then sudo systemctl restart sciencekit-rust; fi"

      - name: Check Services
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "if [ '${{ needs.changes.outputs.java }}' = 'true' ]; then sudo systemctl is-active sciencekit; fi && \
             if [ '${{ needs.changes.outputs.rust }}' = 'true' ]; then sudo systemctl is-active sciencekit-rust; fi"